[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlstudio"
version = "0.1.0"
description = "A Flexible, Scalable, and Reproducible Reinforcement Learning Framework"
authors = [
  { name = "Gibrail Hassan", email = "hassangibrail@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: No License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy",
    "gymnasium",
    "torchrl",
    "mlflow",
    "hydra-core",
    "kedro",
    "ray>=2.52.1",
    "kedro-mlflow",
    "kedro-viz",
    "dash",
    "dash-cytoscape",
    "dash-bootstrap-components",
    "plotly",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8"
]
ray = [
    "ray[default]"

]

[tool.setuptools.packages.find]
where = ["src"]
